<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SATHWIK H NAIK // Data Analyst</title>
  <meta name="description" content="Sathwik H Naik — Data Analyst & Data Scientist. An interactive, video-game-style portfolio." />
  <meta name="theme-color" content="#1a0033" />

  <!-- Open Graph -->
  <meta property="og:title" content="SATHWIK H NAIK // Data Analyst" />
  <meta property="og:description" content="An interactive, video-game-style data portfolio." />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Press+Start+2P&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%B9%EF%B8%8F%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- ===== Animated background layers ===== -->
  <div class="bg">
    <div class="bg-gradient"></div>
    <div class="bg-sun"></div>
    <div class="bg-grid"></div>
    <div class="bg-stars" id="stars"></div>
    <canvas id="particles"></canvas>
    <div class="bg-scanlines"></div>
    <div class="bg-vignette"></div>
  </div>

  <!-- ===== HUD corners ===== -->
  <div class="hud">
    <div class="hud-corner hud-tl">
      <span class="hud-label">PLAYER_01</span>
      <span class="hud-sub">SATHWIK H NAIK</span>
    </div>
    <div class="hud-corner hud-tr">
      <button class="sound-toggle" id="soundToggle" aria-label="Toggle sound">
        <span class="sound-icon">♪</span><span class="sound-state">SFX: ON</span>
      </button>
    </div>
    <div class="hud-corner hud-bl">
      <span class="hud-label">v2026.MS</span>
    </div>
    <div class="hud-corner hud-br">
      <span class="hud-controls">
        <kbd>↑</kbd><kbd>↓</kbd> MOVE &nbsp; <kbd>↵</kbd> SELECT &nbsp; <kbd>ESC</kbd> BACK
      </span>
    </div>
  </div>

  <!-- ===== SCREEN: TITLE ===== -->
  <section class="screen screen-title is-active" id="screen-title" data-screen="title">
    <div class="title-inner">
      <p class="title-pre glitch-soft">DATA&nbsp;//&nbsp;ANALYST&nbsp;//&nbsp;SCIENTIST</p>
      <h1 class="title-logo glitch" data-text="SATHWIK">SATHWIK</h1>
      <h1 class="title-logo title-logo-2 glitch" data-text="H&nbsp;NAIK">H&nbsp;NAIK</h1>
      <p class="title-tag">M.S. DATA SCIENCE @ UNIVERSITY OF MARYLAND</p>
      <button class="press-start" id="pressStart">
        <span class="ps-text">PRESS&nbsp;START</span>
        <span class="ps-sub">click&nbsp;or&nbsp;press&nbsp;[ENTER]</span>
      </button>
    </div>
  </section>

  <!-- ===== SCREEN: MAIN MENU ===== -->
  <section class="screen screen-menu" id="screen-menu" data-screen="menu">
    <header class="menu-header">
      <h2 class="menu-title">MAIN&nbsp;MENU</h2>
      <p class="menu-coords">SELECT A MODE TO CONTINUE</p>
    </header>
    <nav class="menu-list" id="menuList" aria-label="Main menu">
      <!-- buttons injected by JS -->
    </nav>
  </section>

  <!-- ===== SCREEN: CONTENT PANEL ===== -->
  <section class="screen screen-panel" id="screen-panel" data-screen="panel">
    <div class="panel-frame">
      <header class="panel-head">
        <div class="panel-head-left">
          <span class="panel-tag" id="panelTag">MODE</span>
          <h2 class="panel-title" id="panelTitle">TITLE</h2>
        </div>
        <button class="btn-back" id="btnBack">
          <span>◄</span> BACK&nbsp;TO&nbsp;MENU <kbd>ESC</kbd>
        </button>
      </header>
      <div class="panel-body" id="panelBody" tabindex="-1">
        <!-- content injected by JS -->
      </div>
    </div>
  </section>

  <!-- ===== Loading / boot overlay ===== -->
  <div class="boot" id="boot">
    <div class="boot-inner">
      <p class="boot-line">INITIALIZING&nbsp;SATHWIK.EXE</p>
      <div class="boot-bar"><span id="bootFill"></span></div>
      <p class="boot-pct" id="bootPct">0%</p>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
